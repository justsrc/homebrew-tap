name: bottle

on:
  pull_request:
    paths: ["Formula/*.rb"]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle (e.g. fdk-aac)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "bottle-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  bottle:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          core: false
          cask: false

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.ref }}

      - name: Skip automated bottle commits
        id: skipper
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          author="$(git log -1 --format=%an)"
          if [[ "${author}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Install skopeo
        if: steps.skipper.outputs.skip != 'true'
        run: brew install skopeo

      - name: Run brew test-bot --only-bottles
        if: steps.skipper.outputs.skip != 'true'
        run: |
          if [[ -n "${{ inputs.formula }}" ]]; then
            brew test-bot --only-tap --tap=justsrc/homebrew-tap --only-bottles --only-json-tab --skip-dependents --only-formulae "${{ inputs.formula }}"
          else
            brew test-bot --only-tap --tap=justsrc/homebrew-tap --only-bottles --only-json-tab --skip-dependents
          fi

      - name: Merge and upload bottles
        if: steps.skipper.outputs.skip != 'true'
        env:
          HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
          HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          HOMEBREW_GIT_NAME: github-actions[bot]
          HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [[ -z "$(find . -maxdepth 1 -name '*.bottle.json' -print -quit)" ]]; then
            echo "No bottles were built; nothing to merge or upload."
            exit 0
          fi
          brew pr-upload --warn-on-upload-failure --root-url=https://ghcr.io/v2/justsrc/tap

      - name: Push bottles
        if: >
          steps.skipper.outputs.skip != 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: Homebrew/actions/git-try-push@848c272c7bfe984a197bd4d16383f4c106ec61e6 # 2026.09.21.1
        with:
          branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}