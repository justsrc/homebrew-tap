name: bottle

on:
  pull_request:
    paths: ["Formula/*.rb"]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle (e.g. fdk-aac)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: "bottle-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  # Every runner builds the bottle for the macOS version it runs on, because
  # `brew test-bot` derives the bottle tag from the operating system:
  #   macos-26 -> macOS 26 (Tahoe)       -> arm64_tahoe
  #   xcode-27 -> macOS 27 (Golden Gate)  -> arm64_golden_gate
  # The bottles are only merged into the formula by the `publish` job: two
  # runners rewriting the same `bottle do` block would race each other.
  bottle:
    name: bottle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      pull-requests: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          core: false
          cask: false

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Skip automated bottle commits
        id: skipper
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          author="$(git log -1 --format=%an)"
          if [[ "${author}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run brew test-bot --only-formulae
        if: steps.skipper.outputs.skip != 'true'
        run: |
          root_url="https://ghcr.io/v2/${{ github.repository_owner }}/tap"
          if [[ -n "${{ inputs.formula }}" ]]; then
            brew test-bot --only-formulae --tap=justsrc/homebrew-tap --only-json-tab --skip-dependents --root-url="${root_url}" "${{ inputs.formula }}"
          else
            brew test-bot --only-formulae --tap=justsrc/homebrew-tap --only-json-tab --skip-dependents --root-url="${root_url}"
          fi

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: warn

  # Merges the bottles built by every runner into the formula, uploads them to
  # GitHub Packages and commits the updated `bottle do` block.
  publish:
    name: publish bottles
    needs: bottle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      packages: write
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
      HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
      HOMEBREW_GIT_NAME: github-actions[bot]
      HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          core: false
          cask: false

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      # `brew bottle --merge` looks the formula up in the tap directory of the
      # Homebrew installation, so link the checkout into it.
      - name: Link the tap into Homebrew
        run: |
          taps_dir="$(brew --repository)/Library/Taps/justsrc"
          mkdir -p "${taps_dir}"
          ln -sfn "${GITHUB_WORKSPACE}" "${taps_dir}/homebrew-tap"

      # `brew pr-upload` audits the formula it merges, and Homebrew refuses to
      # load formulae from untrusted taps. `brew test-bot` trusts the tap in the
      # build job, but this job does not run it.
      - name: Trust the tap
        run: brew trust justsrc/tap

      - name: Download bottles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottles_*
          merge-multiple: true
          path: bottles

      - name: Check for bottles
        id: bottles
        run: |
          if compgen -G "bottles/*.bottle.json" > /dev/null; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "No bottles were built; nothing to merge or upload."
          fi

      - name: Install skopeo
        if: steps.bottles.outputs.found == 'true'
        run: brew install skopeo

      - name: Merge and upload bottles
        if: steps.bottles.outputs.found == 'true'
        working-directory: bottles
        run: |
          brew pr-upload --warn-on-upload-failure --root-url=https://ghcr.io/v2/justsrc/tap

      - name: Push bottles
        if: >
          steps.bottles.outputs.found == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: Homebrew/actions/git-try-push@c262868c096d909fc278daa87ed9772967331ea3 # 2026.11.02.1
        with:
          branch: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
