name: bottle

on:
  pull_request:
    paths: ["Formula/*.rb"]
  workflow_dispatch:
    inputs:
      formula:
        description: "Formula to bottle (e.g. fdk-aac)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Every runner builds the bottle for the macOS version it runs on, because
  # `brew test-bot` derives the bottle tag from the operating system:
  #   macos-26 -> macOS 26 (Tahoe)      -> arm64_tahoe
  #   xcode-27 -> macOS 27 (Golden Gate) -> arm64_golden_gate
  # The bottles are only merged into the formula by the `publish` job: two
  # runners rewriting the same `bottle do` block would race each other.
  #
  # Publishing is all-or-nothing: `publish` needs every matrix leg to succeed,
  # so a broken or flaky macOS 27 build also holds back the macOS 26 bottles.
  # That is deliberate - publishing a `bottle do` block that is missing a
  # platform would silently drop that platform for everyone installing from
  # the tap.
  #
  # Note that this workflow is only triggered by changes to `Formula/*.rb`, so
  # a change to the workflow itself is validated by the next formula pull
  # request or by a manual `workflow_dispatch` run.
  bottle:
    name: bottle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    # A new commit to the pull request cancels the running build, but not the
    # `publish` job: a cancelled publish could leave the bottles uploaded to
    # GitHub Packages without the formula referencing them.
    concurrency:
      group: bottle-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      # The tap name is the repository without the `homebrew-` prefix, e.g.
      # `justsrc/homebrew-tap` is the tap `justsrc/tap`.
      - name: Set the tap details
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          echo "TAP_NAME=${owner}/${repository#homebrew-}" >> "${GITHUB_ENV}"
          echo "TAP_PATH=${owner}/${repository}" >> "${GITHUB_ENV}"

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # The token is passed to `git-try-push` explicitly, so it does not
          # have to be persisted in the checkout (this job runs third-party
          # formula build code).
          persist-credentials: false

      - name: Skip automated bottle commits
        id: skipper
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          author="$(git log -1 --format=%an)"
          if [[ "${author}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Run brew test-bot --only-formulae
        if: steps.skipper.outputs.skip != 'true'
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          root_url="https://ghcr.io/v2/${TAP_NAME}"
          if [[ -n "${FORMULA}" ]]; then
            # The `--` stops the formula name from being read as an option.
            brew test-bot --only-formulae --tap="${GITHUB_REPOSITORY}" --only-json-tab --skip-dependents --root-url="${root_url}" -- "${FORMULA}"
          else
            brew test-bot --only-formulae --tap="${GITHUB_REPOSITORY}" --only-json-tab --skip-dependents --root-url="${root_url}"
          fi

      - name: Upload bottles as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
          if-no-files-found: warn

  # Merges the bottles built by every runner into the formula, uploads them to
  # GitHub Packages and commits the updated `bottle do` block.
  publish:
    name: publish bottles
    needs: bottle
    # Pull requests from a fork are built and tested, but not published: the
    # bottles would be uploaded to this repository's package and the bottle
    # commit cannot be pushed to the fork.
    if: >
      needs.bottle.result == 'success' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: bottle-publish-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      # `brew pr-upload` can comment on the pull request when a formula loses
      # its `:all` bottle.
      pull-requests: write
      packages: write
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      # `brew pr-upload` uploads the bottles to GitHub Packages with skopeo and
      # needs credentials for it.
      HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
      HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
      HOMEBREW_GIT_NAME: github-actions[bot]
      HOMEBREW_GIT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      # The tap name is the repository without the `homebrew-` prefix, e.g.
      # `justsrc/homebrew-tap` is the tap `justsrc/tap`.
      - name: Set the tap details
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          echo "TAP_NAME=${owner}/${repository#homebrew-}" >> "${GITHUB_ENV}"
          echo "TAP_PATH=${owner}/${repository}" >> "${GITHUB_ENV}"

      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          # The token is passed to `git-try-push` explicitly, so it does not
          # have to be persisted in the checkout (this job runs third-party
          # formula build code).
          persist-credentials: false

      # `brew bottle --merge` looks the formula up in the tap directory of the
      # Homebrew installation. `setup-homebrew` already links the checkout
      # there for tap repositories; this is a safety net for the case where it
      # does not.
      - name: Link the tap into Homebrew
        run: |
          taps_dir="$(brew --repository)/Library/Taps/$(dirname "${TAP_PATH}")"
          mkdir -p "${taps_dir}"
          ln -sfn "${GITHUB_WORKSPACE}" "$(brew --repository)/Library/Taps/${TAP_PATH}"

      # `brew pr-upload` audits the formula it merges, and Homebrew refuses to
      # load formulae from untrusted taps. `setup-homebrew` trusts the tap for
      # tap repositories; this is a safety net for the case where it does not.
      - name: Trust the tap
        run: brew trust "${TAP_NAME}"

      - name: Download bottles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bottles_*
          merge-multiple: true
          path: bottles

      - name: Check for bottles
        id: bottles
        run: |
          if compgen -G "bottles/*.bottle.json" > /dev/null; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
          else
            echo "found=false" >> "${GITHUB_OUTPUT}"
            echo "No bottles were built; nothing to merge or upload."
          fi

      # The bottles were built from the pull request's head commit. If the
      # branch moved on since then, the bottle block would no longer match the
      # formula it is merged into.
      - name: Check that the pull request did not change
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git diff --quiet "${HEAD_SHA}" -- Formula/; then
            echo "::error::the pull request changed after the bottles were built; re-run the workflow"
            exit 1
          fi

      # A formula that could only be bottled for one platform would silently
      # lose its other platform, so fail instead of publishing a partial set.
      - name: Check the bottle platform coverage
        if: steps.bottles.outputs.found == 'true'
        env:
          EXPECTED_BOTTLE_TAGS: arm64_tahoe arm64_golden_gate
          # Formulae that are intentionally single-platform, space separated.
          BOTTLE_PLATFORM_EXCEPTIONS: ""
        run: |
          exit_code=0
          while IFS=$'\t' read -r formula tags; do
            [[ -n "${formula}" ]] || continue
            echo "Formula '${formula}' collected bottle tag(s): [${tags}]"
            case " ${BOTTLE_PLATFORM_EXCEPTIONS} " in
              *" ${formula} "*)
                echo "  -> allow-listed, skipping the platform check"
                continue
                ;;
            esac
            missing=""
            for expected_tag in ${EXPECTED_BOTTLE_TAGS}; do
              case " ${tags} " in
                *" ${expected_tag} "*) ;;
                *) missing="${missing} ${expected_tag}" ;;
              esac
            done
            if [[ -n "${missing}" ]]; then
              echo "::error::Formula '${formula}' is missing required bottle tag(s):${missing}"
              exit_code=1
            fi
          done < <(jq -s -r '
            [ .[] | to_entries[] ]
            | group_by(.key)
            | .[]
            | [
                (.[0].value.formula.name // (.[0].key | split("/") | last)),
                ([ .[].value.bottle.tags | keys[] ] | unique | join(" "))
              ]
            | @tsv
          ' bottles/*.bottle.json)
          exit "${exit_code}"

      - name: Install skopeo
        if: steps.bottles.outputs.found == 'true'
        run: brew install skopeo

      # Without `--warn-on-upload-failure` an upload that cannot happen (the
      # version tag already exists in the registry, or `skopeo inspect` fails)
      # aborts the step. That matters: `brew pr-upload` merges the new
      # checksums into the formula *before* it uploads, so a skipped upload
      # would leave the formula pointing at bottles that were never published.
      # The bottle block is only pushed when the upload succeeded.
      - name: Merge and upload bottles
        if: steps.bottles.outputs.found == 'true'
        working-directory: bottles
        run: |
          brew pr-upload --root-url="https://ghcr.io/v2/${TAP_NAME}"

      - name: Push bottles
        if: steps.bottles.outputs.found == 'true'
        uses: Homebrew/actions/git-try-push@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          branch: ${{ github.event.pull_request.head.ref || github.ref_name }}
          token: ${{ github.token }}
