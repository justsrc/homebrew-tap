name: Scheduled online check
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Once every day at 1AM
    - cron: "0 1 * * *"

concurrency:
  group: scheduled
  cancel-in-progress: true

jobs:
  audit_online:
    runs-on: macos-26
    env:
      HOMEBREW_DEVELOPER: 1
      CASKS: alacritty mark-text radicle-desktop
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@d482da0e602890d3160aade42e72c8556103bf04 # 2026.10.26.1
        with:
          core: false
          cask: true

      - name: Check casks for archived sources
        run: |
          read -r -a CASKS_ARR <<< "$CASKS"
          brew audit --cask --online --skip-style --only github_repository_archived,gitlab_repository_archived "${CASKS_ARR[@]}"

      - name: Check casks for unavailable homepages
        run: |
          read -r -a CASKS_ARR <<< "$CASKS"
          brew audit --cask --online --skip-style --only homepage "${CASKS_ARR[@]}"

      - name: Check casks for missing sources
        run: |
          read -r -a CASKS_ARR <<< "$CASKS"
          brew fetch --cask "${CASKS_ARR[@]}"