# Adapted from the Homebrew `brew tap-new` publish template.
#
# This is the manual recovery path: `bottle.yml` normally merges and publishes
# the bottles itself. `brew pr-pull` locates the workflow run by the pull
# request's head commit, so pass `head_sha` as the commit that ran `bottle.yml`
# - a commit pushed by the workflow bot does not start a new workflow run.
name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        type: number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)
        type: string
        required: false

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      attestations: write
      checks: read
      contents: write
      id-token: write
      issues: read
      # `brew pr-upload` pushes the bottles to GitHub Packages.
      packages: write
      pull-requests: write
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_AUTO_UPDATE: 1
      # `brew pr-upload` uploads the bottles to GitHub Packages and needs
      # credentials for it.
      HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
      HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        id: git_setup
        uses: Homebrew/actions/git-user-config@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1

      - name: Set up commit signing
        uses: Homebrew/actions/setup-commit-signing@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          signing_key: ${{ secrets.BREWTESTBOT_SSH_SIGNING_KEY }}

      # `setup-homebrew` already links the tap into the Homebrew tap directory
      # and trusts it (`brew trust justsrc/tap`).
      - name: Pull bottles
        id: pull_bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GIT_COMMITTER_NAME: ${{ steps.git_setup.outputs.name }}
          HOMEBREW_GIT_COMMITTER_EMAIL: ${{ steps.git_setup.outputs.email }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          if [[ -n "$HEAD_SHA" ]]
          then
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" --head-sha="$HEAD_SHA" \
              --workflows=bottle.yml \
              --no-cherry-pick \
              "$PULL_REQUEST"
          else
            brew pr-pull --debug --retain-bottle-dir --tap="$GITHUB_REPOSITORY" \
              --workflows=bottle.yml \
              --no-cherry-pick \
              "$PULL_REQUEST"
          fi

      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "${{ steps.pull_bottles.outputs.bottle_path }}/*.tar.gz"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          branch: main
