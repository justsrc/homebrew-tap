# Ported from Homebrew/homebrew-core's CI workflow
# (Homebrew/homebrew-core/.github/workflows/tests.yml).
# Adaptations for this tap:
# - `merge_group` trigger removed: this repo does not use a merge queue.
# - The `github.repository_owner == 'Homebrew'` guards removed: this is not a
#   Homebrew org repo.
# - The `report_analytics` job removed: the formulae.brew.sh analytics API only
#   covers homebrew-core/homebrew-cask, so the data would be empty or
#   misleading for this tap's formulae.
# - `HOMEBREW_MACOS_BUILD_ON_GITHUB_RUNNER: true` is set on the runner
#   determination jobs so the test matrix selects GitHub-hosted runners:
#   macOS legs on macos-15/macos-26/xcode-27, Linux legs on
#   ubuntu-24.04-arm/ubuntu-latest (in the ghcr.io/homebrew/brew container).
#   Without it, `brew determine-test-runners` selects the Homebrew org's
#   self-hosted runner labels (e.g. `15-arm64` and its ephemeral `-<run id>`
#   variants), which would queue forever in this repository.
# - The `CI-linux-self-hosted`, `long build` and `long dependent tests` label
#   plumbing is removed for the same reason: hosted runners have no
#   extendable timeouts. Linux legs still request brew's 2160-minute
#   `GITHUB_ACTIONS_LONG_TIMEOUT`, which GitHub clamps to its 360-minute
#   hosted-runner job limit; macOS hosted legs already request 360.
#   `.github/workflows/scripts/check-labels.js` is adapted to match.
# - `HOMEBREW_NO_INSTALL_FROM_API` is dropped: `Homebrew/actions/setup-homebrew`
#   clears it for every non-homebrew-core repository, so dependencies always
#   resolve from the API here (as in bottle.yml). The setup-only jobs omit
#   `core` deliberately (upstream sets `core: true` because it is
#   homebrew-core itself); the test jobs still get core and cask because
#   `Homebrew/actions/pre-build` hardcodes both, so every test leg pays a
#   full clone of homebrew-core and homebrew-cask regardless of these inputs
#   (inherited from upstream's `pre-build` design).
# - `HOMEBREW_ENFORCE_SBOM` dropped: it is generic brew SBOM enforcement, not a
#   homebrew-core-only bottle policy, but this tap's bottles do not declare
#   SBOMs, so enforcement would fail here.
# - `HOMEBREW_TEST_BOT_ANALYTICS` dropped: this tap is not part of Homebrew's
#   analytics pipeline.
# - `HOMEBREW_SORBET_RECURSIVE` dropped from `tap_syntax`: recursive runtime
#   type-checking is a homebrew-core coverage knob, and `brew test-bot`
#   disables it for the full-tap `readall`/`audit` steps anyway.
# - `formulae_detect` runs `brew test-bot --only-formulae-detect`
#   unconditionally, as upstream does: detect's hard-fail requires
#   diff_start == diff_end, which never holds on pull_request merge refs (brew
#   rewrites diff_start to the merge base), so a pull request with no formula
#   changes exits 0 with empty outputs. The pre-check that guarded it was
#   removed: it ignored git's exit status, so a broken checkout would have
#   skipped all testing with a green conclusion.
# - The upstream `Fetch detected formulae bottles` step is removed: brew
#   populates `formulae_to_fetch` only for `merge_group` runs (removed above),
#   so the step was unconditionally inert here.
# - The label script is loaded from the pull request checkout itself, as
#   upstream: a pull request could in principle edit `check-labels.js` to
#   weaken its own checks. This is accepted here because fork authors cannot
#   merge, and any edit to the script is visible in the PR diff for review
#   at merge time. The same applies to `tests.yml` itself: triggers are
#   unfiltered, so a pull request that edits this workflow runs its own copy
#   and controls both the required check's scope and its colour — such pull
#   requests need careful review.
# - The `tests` job sets `upload-bottles: false` and `test_deps` sets
#   `download-bottles: false`: this tap builds and publishes bottle commits
#   via `bottle.yml`/`publish.yml`, so CI bottles would be duplicated
#   (upstream homebrew-core consumes its CI bottles instead) and no
#   `bottles_*` artifacts exist. brew's `--only-formulae-dependents` requires
#   every tested formula to be installed before dependents are tested (it
#   aborts with "Failed to find bottle" otherwise), so `test_deps` installs
#   the pull request's tested formulae from source in a dedicated step
#   before testing dependents; brew then skips each one via
#   `latest_version_installed?`.
# - Name-form invariant: every `--testing-formulae`, `--tested-formulae`,
#   `--added-formulae` and `--deleted-formulae` value is qualified
#   (`<tap>/<formula>`, e.g. `justsrc/tap/fdk-aac`). `formulae_detect` emits
#   qualified names; the runner matrix's per-leg names are rewritten to the
#   qualified form in `setup_runners` (brew emits bare `Formula#name`
#   values, which Formulary would resolve against the homebrew-core API
#   when the same bare name exists there).
# - `test_deps` appends the `-deps` artifact suffix unconditionally, and
#   makes it shard-unique: upstream's Linux-only condition assumes macOS
#   `tests` legs run on self-hosted labels, while here both jobs share
#   GitHub-hosted labels; brew's own shard suffix is a no-op on hosted
#   labels (`sub("-deps", ...)`) so the shard is appended to the post-build
#   `runner` input instead (see the `test_deps` post-build step).
# - The `conclusion` gate is deliberately stricter than upstream: all eight CI
#   jobs must be green, including `tap_syntax` and the dependent-testing jobs,
#   whose failures upstream treats as advisory (upstream's rollup only reads
#   `tests`/`test_deps`/`setup_tests`/`setup_runners` and never acts on the
#   dependent result). The `CI-no-fail-fast-syntax` escape hatch still works:
#   `continue-on-error` reports a failed `tap_syntax` leg as `success`, so
#   labelled syntax failures do not block the gate. Two more states fail the
#   gate: a pull request whose queued formulae match no compatible hosted
#   runner (runners_present false), and a pull request where a queued
#   formula is absent from every runner leg's `testing_formulae` (the
#   coverage union check). Deleting a formula force-activates every runner —
#   including legs with no formulae — and an incompatible formula is
#   silently filtered out of every leg, so neither state may pass green
#   (upstream tolerates both; this gate does not).
# - Triggers are unfiltered, as upstream: every pull_request gets the full
#   formula CI graph, and this workflow is the single publisher of the
#   required `conclusion` check. The cask `ci.yml` workflow is likewise
#   unfiltered (upstream parity) and names its rollup `cask conclusion`, so
#   no pull request can get two producers of one check name (a PR touching
#   both `Formula/*.rb` and `Casks/**` used to), `cask conclusion` can be
#   required without deadlocking PRs that touch no casks (its matrix always
#   includes tap-syntax legs), and PRs that touch neither still get a
#   complete required-check set alongside `actionlint.yml`'s always-on
#   `workflow_syntax`.
# Note: `Homebrew/actions/setup-homebrew` checks out and trusts this tap from
# `GITHUB_REPOSITORY` itself, and `brew test-bot` re-trusts it; no additional
# tap setup steps are required. (The action links the tap with a workspace
# symlink only outside containers; these jobs run in the brew container.)
# Formulae named `portable-*` would
# additionally require Homebrew's ephemeral self-hosted cross-build runners and
# are not supported here; the runner-determination jobs fail fast if a pull
# request adds one.
# - The workflow is named `CI` as upstream homebrew-core (an earlier port had
#   renamed it `tests`); the cask workflow takes the `Cask CI` name so brew's
#   rerun cache, which looks up check suites under a workflow literally named
#   `CI`, stays unambiguous.
name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  HOMEBREW_DEVELOPER: 1
  HOMEBREW_GITHUB_ACTIONS: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_BUILD_ERROR_ISSUES: 1
  GH_REPO: ${{ github.repository }}
  GH_NO_UPDATE_NOTIFIER: 1
  GH_PROMPT_DISABLED: 1
  SCRIPTS_PATH: .github/workflows/scripts

defaults:
  run:
    shell: bash -xeuo pipefail {0}

concurrency:
  group: "tests-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tap_syntax:
    strategy:
      matrix:
        stable: [false, true]
    name: tap_syntax${{ case(matrix.stable, ' (stable)', '') }}
    runs-on: ubuntu-24.04-arm
    continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'CI-no-fail-fast-syntax') }}
    container: # zizmor: ignore[unpinned-images]
      image: ghcr.io/homebrew/brew:${{ case(matrix.stable, 'latest', 'main') }}
    env:
      HOMEBREW_SIMULATE_MACOS_ON_LINUX: 1
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false
          stable: ${{ matrix.stable }}

      - name: Cache style cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/linuxbrew/.cache/Homebrew/style
          key: style-cache-${{ case(matrix.stable, 'stable', 'main') }}-${{ github.sha }}
          restore-keys: style-cache-${{ case(matrix.stable, 'stable', 'main') }}-

      - run: brew test-bot --only-tap-syntax ${STABLE:+"--stable"}
        env:
          STABLE: ${{ case(matrix.stable, '1', '') }}

  formulae_detect:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    container: # zizmor: ignore[unpinned-images]
      image: ghcr.io/homebrew/brew:main
    outputs:
      testing_formulae: ${{ steps.formulae-detect.outputs.testing_formulae }}
      added_formulae: ${{ steps.formulae-detect.outputs.added_formulae }}
      deleted_formulae: ${{ steps.formulae-detect.outputs.deleted_formulae }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      - name: Run brew test-bot --only-formulae-detect
        id: formulae-detect
        run: brew test-bot --only-formulae-detect

  setup_tests:
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    needs: formulae_detect
    outputs:
      syntax-only: ${{ steps.check-labels.outputs.syntax-only }}
      fail-fast: ${{ steps.check-labels.outputs.fail-fast }}
      # Unused here: downstream reads this output from `setup_dep_tests`. Kept
      # for upstream parity with homebrew-core's outputs block.
      test-dependents: ${{ steps.check-labels.outputs.test-dependents }}
      test-bot-formulae-args: ${{ steps.check-labels.outputs.test-bot-formulae-args }}
      # Unused here: downstream reads this output from `setup_dep_tests`. Kept
      # for upstream parity with homebrew-core's outputs block.
      test-bot-dependents-args: ${{ steps.check-labels.outputs.test-bot-dependents-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for CI labels
        id: check-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTING_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
          ADDED_FORMULAE: ${{ needs.formulae_detect.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ needs.formulae_detect.outputs.deleted_formulae }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const path = require('path')
            const script = require(path.resolve(`${process.env.SCRIPTS_PATH}/check-labels.js`))

            const formulae_detect = {
              testing_formulae: `${process.env.TESTING_FORMULAE}`,
              added_formulae: `${process.env.ADDED_FORMULAE}`,
              deleted_formulae: `${process.env.DELETED_FORMULAE}`
            }

            // Seed every output with a safe default first: on the syntax-only
            // early-return path the script sets only `syntax-only`, and unset
            // outputs would reach downstream `fromJson()` consumers as empty
            // strings. The seeds fail safe (`syntax-only: true` skips every
            // testing job); a script that throws mid-run turns this job red
            // via the rethrow below regardless of the seeds. Do not add
            // `continue-on-error` to this step: with the rethrow neutralised,
            // the seeds themselves become the false green — a red label
            // check would skip every testing job and the gate would accept
            // the skip as designed.
            core.setOutput('syntax-only', 'true')
            core.setOutput('fail-fast', 'true')
            core.setOutput('test-dependents', 'false')
            core.setOutput('test-bot-formulae-args', '')
            core.setOutput('test-bot-dependents-args', '')

            // Unlike upstream, which logs and continues, rethrow: a failed
            // label check must be a red job (and a red `conclusion`), never a
            // silent skip that can end in a green required check.
            try {
              await script({github, context, core}, formulae_detect, false)
            } catch (error) {
              console.error(error);
              throw error
            }

  setup_runners:
    needs: [formulae_detect, setup_tests]
    if: >
      github.event_name == 'pull_request' &&
      !fromJson(needs.setup_tests.outputs.syntax-only)
    runs-on: ubuntu-latest
    container: # zizmor: ignore[unpinned-images]
      image: ghcr.io/homebrew/brew:main
    outputs:
      runners: ${{ steps.qualify-formula-names.outputs.runners }}
      runners_present: ${{ steps.determine-runners.outputs.runners_present }}
      covered_formulae: ${{ steps.qualify-formula-names.outputs.covered_formulae }}
    env:
      # This tap has no self-hosted runners: always build the test matrix from
      # GitHub-hosted runners (see the header note for the full label list).
      HOMEBREW_MACOS_BUILD_ON_GITHUB_RUNNER: true
      TESTING_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
      DELETED_FORMULAE: ${{ needs.formulae_detect.outputs.deleted_formulae }}
    steps:
      # Homebrew's ephemeral self-hosted cross-build runners (required by
      # portable-* formulae) do not exist here, so `determine-test-runners`
      # would emit a label that queues forever with green setup jobs.
      - name: Fail fast on unsupported portable formulae
        run: |
          if [[ "$TESTING_FORMULAE" =~ (^|,|/)portable- ]]
          then
            echo "::error title=Unsupported portable formulae::This workflow does not support portable-* formulae (see the header notes)."
            exit 1
          fi

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      - name: Determine runners to use for tests job
        id: determine-runners
        run: brew determine-test-runners "$TESTING_FORMULAE" "$DELETED_FORMULAE"

      # `determine-test-runners` emits bare `Formula#name` values, which
      # Formulary resolves against the homebrew-core API when the same bare
      # name exists there (e.g. this tap's `fdk-aac` vs core's `fdk-aac`).
      # Rewrite every leg's `testing_formulae` to the qualified
      # `<tap>/<formula>` form so both test matrices feed brew names that can
      # only resolve to this tap. The canonical tap name is `GITHUB_REPOSITORY`
      # with `homebrew-` stripped from the repository part
      # (`justsrc/homebrew-tap` -> `justsrc/tap`). Entries that already
      # contain a slash are passed through unchanged. The union of qualified
      # names is also emitted for the `conclusion` gate's coverage check.
      - name: Qualify per-leg formula names
        id: qualify-formula-names
        env:
          RUNNERS_JSON: ${{ steps.determine-runners.outputs.runners }}
        run: |
          tap_name="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's#/homebrew-#/#')"
          if [[ -z "$RUNNERS_JSON" || "$RUNNERS_JSON" == "[]" ]]
          then
            echo "runners=${RUNNERS_JSON:-[]}" >> "$GITHUB_OUTPUT"
            echo "covered_formulae=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          qualified="$(jq -c --arg tap "$tap_name" '
            map(.testing_formulae = (
              if ((.testing_formulae // "") == "") then ""
              else
                [(.testing_formulae | split(","))[]
                  | select(. != "")
                  | if test("/") then . else ($tap + "/" + .) end]
                | join(",")
              end))' <<<"$RUNNERS_JSON")"
          covered="$(jq -r --arg tap "$tap_name" '
            [(.[] | .testing_formulae | select(. != "") | split(","))[]]
            | unique | join(",")' <<<"$qualified")"
          echo "runners=${qualified}" >> "$GITHUB_OUTPUT"
          echo "covered_formulae=${covered}" >> "$GITHUB_OUTPUT"

  tests:
    needs: [tap_syntax, formulae_detect, setup_tests, setup_runners]
    if: >
      github.event_name == 'pull_request' &&
      !fromJson(needs.setup_tests.outputs.syntax-only) &&
      fromJson(needs.setup_runners.outputs.runners_present)
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup_runners.outputs.runners) }}
      fail-fast: ${{ fromJson(needs.setup_tests.outputs.fail-fast) }}
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images]
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: /bin/bash -xeuo pipefail {0}
        working-directory: ${{ matrix.workdir || github.workspace }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOTTLES_DIR: ${{ matrix.workdir || github.workspace }}/bottles
    steps:
      - name: Pre-test steps
        uses: Homebrew/actions/pre-build@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          bottles-directory: ${{ env.BOTTLES_DIR }}
          cleanup: ${{ matrix.cleanup }}

      - name: Configure macOS cross-build target
        if: matrix.target_macos
        env:
          TARGET_MACOS: ${{ matrix.target_macos }}
        run: |
          test -n "$TARGET_MACOS"
          echo "HOMEBREW_FAKE_MACOS=$TARGET_MACOS" >> "$GITHUB_ENV"

      - name: Test formulae
        id: brew-test-bot-formulae
        run: |
          xargs -t brew test-bot \
            --testing-formulae="$TESTING_FORMULAE" \
            --added-formulae="$ADDED_FORMULAE" \
            --deleted-formulae="$DELETED_FORMULAE" \
            <<<"$TEST_BOT_FORMULAE_ARGS"
        env:
          TEST_BOT_FORMULAE_ARGS: ${{ needs.setup_tests.outputs.test-bot-formulae-args }}
          TESTING_FORMULAE: ${{ matrix.testing_formulae }}
          ADDED_FORMULAE: ${{ needs.formulae_detect.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ needs.formulae_detect.outputs.deleted_formulae }}
        working-directory: ${{ env.BOTTLES_DIR }}

      - name: Post-build steps
        if: always()
        uses: Homebrew/actions/post-build@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          runner: ${{ matrix.runner }}
          cleanup: ${{ matrix.cleanup }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ format('{0}/logs', env.BOTTLES_DIR) }}
          # `bottle.yml` owns bottle building and publishing for this tap
          # (`publish.yml` consumes its artifacts); uploading here would
          # build and ship every PR's bottles twice.
          upload-bottles: false

  setup_dep_tests:
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    needs: [setup_tests, formulae_detect]
    outputs:
      syntax-only: ${{ steps.check-labels.outputs.syntax-only }}
      fail-fast: ${{ steps.check-labels.outputs.fail-fast }}
      test-dependents: ${{ steps.check-labels.outputs.test-dependents }}
      dependent-shards: ${{ steps.check-labels.outputs.dependent-shards }}
      # Unused here: downstream reads this output from `setup_tests`. Kept for
      # upstream parity with homebrew-core's outputs block.
      test-bot-formulae-args: ${{ steps.check-labels.outputs.test-bot-formulae-args }}
      test-bot-dependents-args: ${{ steps.check-labels.outputs.test-bot-dependents-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for CI labels
        id: check-labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TESTING_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
          ADDED_FORMULAE: ${{ needs.formulae_detect.outputs.added_formulae }}
          DELETED_FORMULAE: ${{ needs.formulae_detect.outputs.deleted_formulae }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          retries: 3
          script: |
            const path = require('path')
            const script = require(path.resolve(`${process.env.SCRIPTS_PATH}/check-labels.js`))

            const formulae_detect = {
              testing_formulae: `${process.env.TESTING_FORMULAE}`,
              added_formulae: `${process.env.ADDED_FORMULAE}`,
              deleted_formulae: `${process.env.DELETED_FORMULAE}`
            }

            // Seed every output with a safe default first: on the syntax-only
            // early-return path the script sets only `syntax-only`, and unset
            // outputs would reach downstream `fromJson()` consumers as empty
            // strings. The seeds fail safe (`syntax-only: true` skips every
            // testing job); a script that throws mid-run turns this job red
            // via the rethrow below regardless of the seeds. Do not add
            // `continue-on-error` to this step: with the rethrow neutralised,
            // the seeds themselves become the false green — a red label
            // check would skip every testing job and the gate would accept
            // the skip as designed.
            core.setOutput('syntax-only', 'true')
            core.setOutput('fail-fast', 'true')
            core.setOutput('test-dependents', 'false')
            core.setOutput('dependent-shards', '1')
            core.setOutput('test-bot-formulae-args', '')
            core.setOutput('test-bot-dependents-args', '')

            // Unlike upstream, which logs and continues, rethrow: a failed
            // label check must be a red job (and a red `conclusion`), never a
            // silent skip that can end in a green required check.
            try {
              await script({github, context, core}, formulae_detect, true)
            } catch (error) {
              console.error(error);
              throw error
            }

  setup_dep_runners:
    needs: [formulae_detect, setup_dep_tests]
    if: >
      github.event_name == 'pull_request' &&
      !fromJson(needs.setup_dep_tests.outputs.syntax-only) &&
      fromJson(needs.setup_dep_tests.outputs.test-dependents)
    runs-on: ubuntu-latest
    container: # zizmor: ignore[unpinned-images]
      image: ghcr.io/homebrew/brew:main
    outputs:
      runners: ${{ steps.determine-dependent-runners.outputs.runners }}
      runners_present: ${{ steps.determine-dependent-runners.outputs.runners_present }}
    env:
      # As in `setup_runners`: GitHub-hosted runners only.
      HOMEBREW_MACOS_BUILD_ON_GITHUB_RUNNER: true
      DEPENDENT_SHARDS: ${{ needs.setup_dep_tests.outputs.dependent-shards }}
      TESTING_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
    steps:
      # Homebrew's ephemeral self-hosted cross-build runners (required by
      # portable-* formulae) do not exist here, so `determine-test-runners`
      # would emit a label that queues forever with green setup jobs.
      - name: Fail fast on unsupported portable formulae
        run: |
          if [[ "$TESTING_FORMULAE" =~ (^|,|/)portable- ]]
          then
            echo "::error title=Unsupported portable formulae::This workflow does not support portable-* formulae (see the header notes)."
            exit 1
          fi

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          core: false
          cask: false

      - name: Determine runners to use for test_deps job
        id: determine-dependent-runners
        run: brew determine-test-runners --dependents --dependent-shards="$DEPENDENT_SHARDS" "$TESTING_FORMULAE"
        env:
          HOMEBREW_REQUIRE_TAP_TRUST: 1

  test_deps:
    needs:
      [tap_syntax, formulae_detect, setup_dep_tests, setup_dep_runners, tests]
    if: >
      (success() ||
      (failure() &&
       !fromJson(needs.setup_dep_tests.outputs.fail-fast) &&
       !contains(fromJson('["skipped", "cancelled"]'), needs.tests.result))) &&
      github.event_name == 'pull_request' &&
      !fromJson(needs.setup_dep_tests.outputs.syntax-only) &&
      fromJson(needs.setup_dep_tests.outputs.test-dependents) &&
      fromJson(needs.setup_dep_runners.outputs.runners_present)
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup_dep_runners.outputs.runners) }}
      fail-fast: ${{ fromJson(needs.setup_dep_tests.outputs.fail-fast) }}
    name: ${{ matrix.name }} (deps)
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images]
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        shell: /bin/bash -xeuo pipefail {0}
        working-directory: ${{ matrix.workdir || github.workspace }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOTTLES_DIR: ${{ matrix.workdir || github.workspace }}/bottles
      TESTING_FORMULAE: ${{ matrix.testing_formulae }}
    steps:
      - name: Pre-test steps
        uses: Homebrew/actions/pre-build@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          bottles-directory: ${{ env.BOTTLES_DIR }}
          cleanup: ${{ matrix.cleanup }}
          download-bottles: false

      # brew's `--only-formulae-dependents` requires every tested formula to
      # be installed before dependents are determined: it aborts with
      # "Failed to find bottle" for the first tested formula that is neither
      # installed nor skipped as tag-incompatible. This workflow builds no CI
      # bottles (`upload-bottles: false` in `tests`, `download-bottles: false`
      # here), so install them from source up front and let brew skip each
      # one via `latest_version_installed?`. Install failures are tolerated:
      # a formula that cannot be installed on this leg's platform is skipped
      # by brew's own `compatible_with_tag?` gate, and a compatible formula
      # that fails to install is still caught by brew's missing-bottle abort,
      # so the job cannot go green without either an install or a designed
      # skip.
      - name: Install tested formulae from source
        env:
          TESTED_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
        run: |
          if [[ -z "$TESTED_FORMULAE" ]]
          then
            echo "No formulae to pre-install."
            exit 0
          fi
          IFS=',' read -r -a tested_formulae_array <<< "$TESTED_FORMULAE"
          for tested_formula in "${tested_formulae_array[@]}"
          do
            [[ -z "$tested_formula" ]] && continue
            brew install --formula "$tested_formula" || \
              printf '::warning::could not pre-install %s on this leg; brew'"'"'s own compatibility and bottle checks apply.\n' "$tested_formula"
          done

      - name: Test dependents
        run: |
          if [[ -n "$FORMULAE_DEPENDENTS_SHARD" ]]
          then
            TEST_BOT_DEPENDENTS_ARGS="${TEST_BOT_DEPENDENTS_ARGS} --formulae-dependents-shard=${FORMULAE_DEPENDENTS_SHARD}"
          fi

          xargs -t brew test-bot \
            --testing-formulae="$TESTING_FORMULAE" \
            --tested-formulae="$TESTED_FORMULAE" \
            <<<"$TEST_BOT_DEPENDENTS_ARGS"
        env:
          FORMULAE_DEPENDENTS_SHARD: ${{ matrix.formulae_dependents_shard || '' }}
          TEST_BOT_DEPENDENTS_ARGS: ${{ needs.setup_dep_tests.outputs.test-bot-dependents-args }}
          TESTED_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
        working-directory: ${{ env.BOTTLES_DIR }}

      - name: Steps summary and cleanup
        if: always()
        uses: Homebrew/actions/post-build@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          # Upstream appends `-deps` only on Linux because its macOS `tests`
          # legs run on self-hosted labels; here both jobs share GitHub-hosted
          # macOS labels, so the suffix must be unconditional. It must also be
          # shard-unique: brew's own shard suffix
          # (`sub("-deps", "-deps<shard>")`) is a no-op on hosted runner
          # labels, so with `CI-parallel-dependents` the shard (`2/4` ->
          # `2-4`) is appended here to keep the artifacts (logs_, dependents_,
          # failed-bottles_) collision-free.
          runner: ${{ format('{0}-deps{1}', matrix.runner, replace(matrix.formulae_dependents_shard || '', '/', '-')) }}
          cleanup: ${{ matrix.cleanup }}
          bottles-directory: ${{ env.BOTTLES_DIR }}
          logs-directory: ${{ format('{0}/logs', env.BOTTLES_DIR) }}
          upload-bottles: false

  conclusion:
    needs:
      [tap_syntax, formulae_detect, setup_tests, setup_runners, tests,
       setup_dep_tests, setup_dep_runners, test_deps]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - name: Check CI results
        env:
          TAP_SYNTAX_RESULT: ${{ needs.tap_syntax.result }}
          FORMULAE_DETECT_RESULT: ${{ needs.formulae_detect.result }}
          SETUP_TESTS_RESULT: ${{ needs.setup_tests.result }}
          SETUP_RUNNERS_RESULT: ${{ needs.setup_runners.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SETUP_DEP_TESTS_RESULT: ${{ needs.setup_dep_tests.result }}
          SETUP_DEP_RUNNERS_RESULT: ${{ needs.setup_dep_runners.result }}
          DEPS_TESTS_RESULT: ${{ needs.test_deps.result }}
          RUNNERS_PRESENT: ${{ needs.setup_runners.outputs.runners_present }}
          COVERED_FORMULAE: ${{ needs.setup_runners.outputs.covered_formulae }}
          SYNTAX_ONLY: ${{ needs.setup_tests.outputs.syntax-only }}
          TESTING_FORMULAE: ${{ needs.formulae_detect.outputs.testing_formulae }}
        run: |
          # This is the required status check for the formula side, so it must
          # go red whenever any CI job did not behave as designed.
          #
          # 1. No job may finish `failure` or `cancelled` — including
          #    `test_deps` and the setup jobs, whose failures upstream treats
          #    as advisory. A cancelled fail-fast matrix is a real failure.
          for job_result in \
            "tap_syntax=$TAP_SYNTAX_RESULT" \
            "formulae_detect=$FORMULAE_DETECT_RESULT" \
            "setup_tests=$SETUP_TESTS_RESULT" \
            "setup_runners=$SETUP_RUNNERS_RESULT" \
            "tests=$TESTS_RESULT" \
            "setup_dep_tests=$SETUP_DEP_TESTS_RESULT" \
            "setup_dep_runners=$SETUP_DEP_RUNNERS_RESULT" \
            "test_deps=$DEPS_TESTS_RESULT"
          do
            job="${job_result%%=*}"
            result="${job_result#*=}"
            if [[ "$result" = "failure" || "$result" = "cancelled" ]]
            then
              # Silence lint error about backtick usage inside single quotes.
              # shellcheck disable=SC2016
              printf '::error ::`%s` job %s.\n' "$job" "$result"
              exit 1
            fi
          done

          # 2. These jobs have no designed skip path on pull_request events,
          #    so anything but success means an upstream need failed (caught
          #    above) or the job graph is inconsistent.
          for job_result in \
            "tap_syntax=$TAP_SYNTAX_RESULT" \
            "formulae_detect=$FORMULAE_DETECT_RESULT" \
            "setup_tests=$SETUP_TESTS_RESULT" \
            "setup_dep_tests=$SETUP_DEP_TESTS_RESULT"
          do
            job="${job_result%%=*}"
            result="${job_result#*=}"
            if [[ "$result" != "success" ]]
            then
              # Silence lint error about backtick usage inside single quotes.
              # shellcheck disable=SC2016
              printf '::error ::`%s` job finished %s, expected success.\n' "$job" "$result"
              exit 1
            fi
          done

          # 3. The `tests` result must be consistent with the gates that
          #    decide whether it runs.
          # Silence lint error about backtick usage inside single quotes.
          # shellcheck disable=SC2016
          printf '::notice ::`tests` job status: %s\n' "$TESTS_RESULT"
          if [[ "$TESTS_RESULT" = "success" ]]
          then
            # Silence lint error about backtick usage inside single quotes.
            # shellcheck disable=SC2016
            if [[ "$SETUP_RUNNERS_RESULT" != "success" ]] ||
               [[ "${RUNNERS_PRESENT-}" != "true" ]] ||
               [[ "${SYNTAX_ONLY-}" != "false" ]]
            then
              printf '::error ::inconsistent state on the `tests` success path.\n'
              exit 1
            fi

            # 5b. Every queued formula must be assigned to at least one leg:
            #     deleting a formula force-activates every runner (including
            #     legs with no formulae) and incompatible formulae are
            #     silently filtered out of every leg, so `tests` can succeed
            #     while a queued formula was never tested. Compare on the
            #     tap-relative name: matrix legs carry qualified names.
            tap_name="$(printf '%s' "${GITHUB_REPOSITORY-}" | sed 's#/homebrew-#/#')"
            covered="$(printf '%s\n' "${COVERED_FORMULAE-}" | tr ',' '\n' | sed "s#^${tap_name}/##" | grep -v '^$' || true)"
            while IFS= read -r queued_formula
            do
              [[ -z "$queued_formula" ]] && continue
              queued_formula="${queued_formula#${tap_name}/}"
              if ! printf '%s\n' "$covered" | grep -Fxq -- "$queued_formula"
              then
                printf '::error ::formula queued for testing but absent from every runner leg: %s\n' "$queued_formula"
                exit 1
              fi
            done < <(printf '%s\n' "$TESTING_FORMULAE" | tr ',' '\n')
            exit 0
          fi

          # 4. `tests` was skipped: designed when the PR is syntax-only.
          if [[ "${SYNTAX_ONLY-}" = "true" ]]
          then
            exit 0
          fi

          # 5. Formulae were queued for testing but the runner matrix assigned
          #    none: the PR would merge green with zero formula testing.
          #    Upstream tolerates that; this gate deliberately fails closed.
          if [[ -n "${TESTING_FORMULAE-}" && "${RUNNERS_PRESENT-}" = "false" ]]
          then
            printf '::error ::formulae queued for testing but no compatible runners were assigned: %s\n' "$TESTING_FORMULAE"
            exit 1
          fi

          # 6. `tests` skipped with nothing to test (docs-only changes,
          #    formulae deletions): the skip is designed.
          if [[ "${RUNNERS_PRESENT-}" = "false" ]]
          then
            exit 0
          fi

          # If we made it here, something went wrong with our workflow run
          # that needs investigating.
          printf '::error ::Unexpected outcome!\n'
          # Silence lint error about backtick usage inside single quotes.
          # shellcheck disable=SC2016
          printf '::error ::`tests` job result: %s\n' "$TESTS_RESULT" # success/skipped
          printf '::error ::runners assigned:   %s\n' "${RUNNERS_PRESENT-}" # true/false/''
          printf '::error ::syntax-only:        %s\n' "${SYNTAX_ONLY-}" # true/false/''
          exit 1
